name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: task-reporter-linux-amd64
          - os: windows
            arch: amd64
            binary: task-reporter-windows-amd64.exe
          - os: darwin
            arch: amd64
            binary: task-reporter-darwin-amd64
          - os: darwin
            arch: arm64
            binary: task-reporter-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -v -o dist/${{ matrix.binary }} main.go

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with: 
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
